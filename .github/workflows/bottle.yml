name: bottle

on:
  workflow_dispatch:
    inputs:
      formula:
        description: "Formula to bottle"
        required: true
        default: "oo7"
  push:
    branches:
      - "bottle-*"

permissions:
  contents: write

jobs:
  bottle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Homebrew
        id: setup-homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Tap this repository
        run: brew tap xtruder/tap "$GITHUB_WORKSPACE"

      - name: Build and bottle
        id: bottle
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_FROM_API: "1"
          HOMEBREW_NO_ANALYTICS: "1"
        run: |
          formula="${{ github.event.inputs.formula || 'oo7' }}"
          brew install --build-bottle "xtruder/tap/${formula}"
          brew bottle --root-url="https://github.com/xtruder/homebrew-tap/releases/download" \
            --json bottle.json "${formula}"
          version="$(brew info --json=v2 "xtruder/tap/${formula}" | jq -r '.formulae[0].versions.stable')"
          bottle_file="$(ls ./*.bottle.tar.gz | head -n 1)"
          echo "formula=${formula}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "bottle_file=${bottle_file}" >> "$GITHUB_OUTPUT"

      - name: Publish bottle to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          formula="${{ steps.bottle.outputs.formula }}"
          version="${{ steps.bottle.outputs.version }}"
          file="${{ steps.bottle.outputs.bottle_file }}"
          if gh release view "${version}" --repo xtruder/homebrew-tap >/dev/null 2>&1; then
            gh release upload "${version}" "${file}" --repo xtruder/homebrew-tap --clobber
          else
            gh release create "${version}" "${file}" --repo xtruder/homebrew-tap \
              --title "${formula} ${version}" --generate-notes
          fi

      - name: Merge bottle block into formula
        run: brew bottle --merge --write --no-commit bottle.json

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula
          git commit -m "bottle: add ${{ steps.bottle.outputs.formula }} ${{ steps.bottle.outputs.version }}" \
            || echo "no formula changes"
          git push
