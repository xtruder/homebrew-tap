name: Checksums

on:
  pull_request:
    paths: ["Formula/**", "scripts/check-checksums.sh", ".github/workflows/checksums.yml"]
  push:
    branches: [main]
    paths: ["Formula/**", "scripts/check-checksums.sh", ".github/workflows/checksums.yml"]

jobs:
  checksums:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-checksums.sh
